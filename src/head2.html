<title>__TITLE__</title>
<style>
:root{
  --navy:#1F2A66; --navy-d:#141C47; --navy-l:#2E3D8C;
  --ink:#141414; --ink-2:#4a4a52; --ink-3:#7b7b86;
  --bg:#f4f5f8; --card:#fff; --line:#e3e5ec;
  --tint:#eef1fa; --tint-line:#d5dbf1; --stripe:#fafbfd; --hdr-sub:#c9cfe8; --warn-bg:#fff8ec;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#0f7a4d; --warn:#b06a00; --crit:#c0392b;
  --hH:104px; --hT:46px;
}
/* ---- temas alternativos ---- */
:root[data-theme="midnight"]{
  --navy:#a5b4fc; --navy-d:#3730a3; --navy-l:#6366f1;
  --ink:#e9eaf3; --ink-2:#aab0c8; --ink-3:#767c99;
  --bg:#0d0f16; --card:#171a24; --line:#2b2f42;
  --tint:rgba(165,180,252,.14); --tint-line:rgba(165,180,252,.30); --stripe:#1c2030; --hdr-sub:#c7cdf0; --warn-bg:rgba(217,119,6,.16);
}
:root[data-theme="abissal"]{
  --navy:#5eead4; --navy-d:#115e59; --navy-l:#0d9488;
  --ink:#e6f7f4; --ink-2:#9fc4bb; --ink-3:#63897f;
  --bg:#071613; --card:#0f221d; --line:#1d372f;
  --tint:rgba(94,234,212,.14); --tint-line:rgba(94,234,212,.30); --stripe:#0c1c17; --hdr-sub:#bdeee3; --warn-bg:rgba(217,119,6,.16);
}
:root[data-theme="bordo"]{
  --navy:#8a1538; --navy-d:#5c0e26; --navy-l:#a3234f;
  --ink:#241016; --ink-2:#5c4650; --ink-3:#8a7580;
  --bg:#faf6f7; --card:#fff; --line:#ecdfe3;
  --tint:rgba(138,21,56,.08); --tint-line:rgba(138,21,56,.22); --stripe:#fbf3f5; --hdr-sub:#f0c7d4; --warn-bg:#fff8ec;
}
:root[data-theme="terracota"]{
  --navy:#9a3412; --navy-d:#7c2d12; --navy-l:#c2410c;
  --ink:#231207; --ink-2:#5c4433; --ink-3:#8a7462;
  --bg:#faf7f3; --card:#fff; --line:#ece2d6;
  --tint:rgba(194,65,12,.08); --tint-line:rgba(194,65,12,.22); --stripe:#fbf6ef; --hdr-sub:#f3d3bb; --warn-bg:#fff8ec;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Inter","Segoe UI",Roboto,-apple-system,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:none;margin:0 auto;padding:0 20px 60px}
@media(max-width:480px){.wrap{padding:0 12px 40px}}

/* ---- cabeçalho fixo ---- */
#hdr{position:fixed;top:0;left:0;right:0;z-index:60;background:linear-gradient(120deg,var(--navy-d),var(--navy-l));
  color:#fff;box-shadow:0 2px 10px rgba(20,28,71,.22);transition:padding .18s ease}
.hdr-in{max-width:none;margin:0 auto;padding:14px 20px;display:flex;gap:18px;align-items:center;flex-wrap:nowrap}
.logo{background:#fff;border-radius:10px;padding:7px 11px;line-height:0;flex:0 0 auto;transition:padding .18s ease}
.logo img{width:150px;height:auto;display:block;transition:width .18s ease}
.hd{min-width:0}
.hd h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd p{margin:3px 0 0;font-size:12.5px;color:var(--hdr-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .badge{display:inline-block;margin-top:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);
  border-radius:999px;padding:2px 10px;font-size:11.5px;white-space:nowrap}
body.shrunk .hdr-in{padding:7px 20px}
body.shrunk .logo{padding:4px 8px}
body.shrunk .logo img{width:92px}
body.shrunk .hd h1{font-size:15px}
body.shrunk .hd p,body.shrunk .hd .badge{display:none}

.brand{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.stamp{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.26);border-radius:8px;
  padding:4px 9px;line-height:1.25;text-align:center;transition:padding .18s ease}
.stamp .lb{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--hdr-sub);font-weight:600}
.stamp .dt{display:block;font-size:11.5px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
body.shrunk .stamp{padding:2px 7px}
body.shrunk .stamp .lb{display:none}
body.shrunk .stamp .dt{font-size:10.5px}
@media(max-width:760px){
  .stamp .lb{display:none}
  .stamp{padding:2px 6px}
  .stamp .dt{font-size:10px}
}
.theme-switch{flex:0 0 auto;margin-left:auto}
.theme-switch select{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;
  border-radius:8px;padding:7px 10px;font:inherit;font-size:12px;cursor:pointer;appearance:auto}
.theme-switch select:hover{background:rgba(255,255,255,.22)}
.theme-switch select option{color:#141414;background:#fff}
body.shrunk .theme-switch select{padding:4px 8px;font-size:11px}
@media(max-width:640px){.theme-switch{display:none}}
/* ---- abas ---- */
#tabs{background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs-in{max-width:none;margin:0 auto;padding:0 20px;display:flex;gap:2px;min-height:var(--hT)}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:12px 15px;font:inherit;
  font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--navy);background:var(--tint)}
.tab[aria-selected=true]{color:var(--navy);border-bottom-color:var(--navy)}
.tab .cnt{display:inline-block;background:var(--tint);color:var(--navy);border-radius:999px;font-size:10.5px;
  padding:1px 6px;margin-left:6px;font-weight:700}
#hchips{display:none;background:var(--tint);border-bottom:1px solid var(--tint-line)}
#hchips.on{display:block}
#hchips .in{max-width:none;margin:0 auto;padding:7px 20px;display:flex;flex-wrap:nowrap;gap:7px;align-items:center;overflow-x:auto;white-space:nowrap}
#hchips .chip{flex:0 0 auto}
#spacer{height:calc(var(--hH) + var(--hT))}
.panel{display:none} .panel.on{display:block}

h2.sec{font-size:14.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--navy);margin:26px 0 12px;
  display:flex;align-items:center;gap:9px}
h2.sec::before{content:"";width:4px;height:16px;background:var(--navy);border-radius:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  box-shadow:0 1px 2px rgba(20,28,71,.05)}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(400px,1fr))}
.three{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:12px;
  padding:13px 15px;min-height:100px}
.kpi .lb{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  display:flex;align-items:center;gap:6px}
.kpi .lb::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--navy);flex:0 0 auto}
.kpi .vl{font-size:25px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi .sb{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.kpi.k-warn{border-left-color:var(--warn)}.kpi.k-good{border-left-color:var(--good)}.kpi.k-crit{border-left-color:var(--crit)}
.kpi[data-dim],.card.alert[data-key]{cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.kpi[data-dim]:hover,.card.alert[data-key]:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,28,71,.13)}
.kpi.on,.card.alert.on{outline:2px solid var(--navy);outline-offset:-2px}

/* ---- filtros ---- */
#fbar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:16px 0 4px}
.filters{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:end}
.f label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);
  font-weight:600;margin-bottom:5px}
select,input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);
  font:inherit;font-size:13px;color:var(--ink)}
/* iOS Safari dá zoom automático em campo de texto com font-size < 16px ao focar */
@media(max-width:760px){select,input[type=search]{font-size:16px}}

/* ---- combobox multi-seleção com checkbox (substitui <select> nos filtros do topo) ---- */
.msel{position:relative}
.msel-btn{width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);
  font:inherit;font-size:13px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msel-btn::after{content:"▾";color:var(--ink-3);font-size:10px;flex:0 0 auto}
.msel.open .msel-btn{border-color:var(--navy)}
.msel-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;width:100%;min-width:200px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,28,71,.18);z-index:50}
.msel.open .msel-panel{display:block}
.msel-search{padding:7px;border-bottom:1px solid var(--line)}
.msel-search input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:16px}
@media(min-width:761px){.msel-search input{font-size:12.5px}}
.msel-opts{max-height:240px;overflow-y:auto;padding:4px 0}
.msel-opt{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12.5px;cursor:pointer}
.msel-opt:hover{background:var(--tint)}
.msel-opt input{margin:0;flex:0 0 auto;width:15px;height:15px;accent-color:var(--navy)}
.btn{background:var(--navy-d);color:#fff;border:0;border-radius:9px;padding:8px 15px;font:inherit;font-size:12.5px;
  font-weight:600;cursor:pointer}
.btn:hover{background:var(--navy-l)}
.btn.sec{background:var(--card);color:var(--navy);border:1px solid var(--navy)}
.btn.sec:hover{background:var(--tint)}
.btn.xs{padding:5px 10px;font-size:11.5px;border-radius:7px}
.chart-export{display:block;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;align-items:center}
.chip{background:var(--tint);color:var(--navy);border:1px solid var(--tint-line);border-radius:999px;padding:3px 6px 3px 11px;
  font-size:12px;display:inline-flex;align-items:center;gap:5px}
.chip b{font-weight:600}
.chip .x{cursor:pointer;background:var(--tint-line);color:var(--navy);border-radius:50%;width:16px;height:16px;
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;line-height:1;border:0;font-weight:700}
.chip .x:hover{background:var(--navy-d);color:#fff}
.chip.stat{background:var(--navy-d);color:#fff;border-color:var(--navy-d);padding:3px 11px}

.ch-t{font-size:14px;font-weight:700;margin:0 0 2px}
.ch-s{font-size:12.5px;color:var(--ink-2);margin:0 0 10px}
.hint{font-size:11.5px;color:var(--ink-3);margin:0 0 10px;display:flex;align-items:center;gap:6px}
.hint::before{content:"\1F5B1";font-size:12px}
.cbox{position:relative;height:300px;min-width:0}.cbox.tall{height:390px}.cbox.xtall{height:470px}
.cbox.scroll{overflow-y:auto;overflow-x:hidden}
.cbox-inner{position:relative;width:100%;min-height:100%}
canvas{cursor:pointer;max-width:100%}

.tbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tbar .sp{flex:1}
.tw{overflow:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--line);max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;background:var(--card)}
thead th{position:sticky;top:0;background:var(--navy-d);color:#fff;text-align:left;padding:9px 11px;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;cursor:pointer;z-index:2}
thead th:hover{background:var(--navy-l)}
thead th::after{content:"\2195";opacity:.45;margin-left:6px;font-size:10px}
thead th.on::after{content:attr(data-a);opacity:1}
tbody td{padding:8px 11px;border-top:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even){background:var(--stripe)}
tbody tr:hover{background:var(--tint)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.hm td{text-align:center;font-variant-numeric:tabular-nums;cursor:pointer}
.hm td.lbl{text-align:left;font-weight:600;white-space:normal;min-width:170px;cursor:pointer}
.hm td.tot{cursor:default;font-weight:700}
.tg{display:inline-block;background:var(--tint);border:1px solid var(--tint-line);border-radius:6px;padding:1px 7px;
  font-size:11.5px;margin:1px 3px 1px 0;color:var(--navy)}
.note{font-size:12.5px;color:var(--ink-2);margin:10px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.alert{border-left:4px solid var(--warn);background:var(--warn-bg)}

/* ---- mapa da hierarquia (Times_2) ---- */
.mm-wrap{position:relative;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;background:var(--bg)}
.mm-lines{position:absolute;top:0;left:0;pointer-events:none;display:block}
.mm-cols{display:flex;gap:34px;padding:6px;position:relative}
.mm-col{flex:0 0 210px;display:flex;flex-direction:column;gap:8px}
.mm-col h4{margin:0 0 2px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700}
.mm-node{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;
  transition:border-color .12s ease,box-shadow .12s ease}
.mm-node:hover{border-color:var(--navy)}
.mm-node.sel{border-color:var(--navy);background:var(--tint);box-shadow:0 0 0 2px var(--navy) inset}
.mm-node.nc{cursor:default}
.mm-node.nc:hover{border-color:var(--line)}
.mm-node .nm{font-weight:700;font-size:12.5px;color:var(--ink);overflow-wrap:anywhere}
.mm-node .vl{font-size:11px;color:var(--ink-2);margin-top:3px;font-variant-numeric:tabular-nums}
.mm-client{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.mm-client .nm{font-weight:700;font-size:12.5px;margin-bottom:5px;overflow-wrap:anywhere}
.mm-client dl{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin:0;font-size:11px}
.mm-client dt{color:var(--ink-3)}
.mm-client dd{margin:0;color:var(--ink-2);overflow-wrap:anywhere}
.mm-empty{font-size:12px;color:var(--ink-3);padding:6px 2px}
#empty{display:none;text-align:center;padding:40px 20px}
#empty.on{display:block}
#empty h3{margin:0 0 6px;color:var(--navy)}
footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
@media(max-width:760px){
  :root{--hH:74px}
  .hd p,.hd .badge{display:none}
  .hd h1{font-size:16px}.logo img{width:104px}
  .cbox{height:280px}.cbox.tall,.cbox.xtall{height:340px}
  /* .two força coluna de 400px mínimo — estoura a largura de qualquer iPhone (o maior tem ~390px úteis) */
  .two{grid-template-columns:1fr}
  /* 2 cards de KPI por linha em vez de 1 coluna comprida */
  .kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .btn{padding:10px 15px}
  /* barra de filtros vira um painel recolhível — 10 selects empilhados antes do conteúdo é ruim no celular */
  #fbarToggle{display:inline-flex;align-items:center;gap:6px}
  #fbar:not(.open) .filters{display:none}
}
@media(min-width:761px){#fbarToggle{display:none}}

/* ---- rankings ---- */
.rkbar{display:flex;gap:16px;flex-wrap:wrap;align-items:end;margin-bottom:4px}
.seg{display:inline-flex;background:var(--tint);border:1px solid var(--tint-line);border-radius:10px;padding:3px;gap:3px}
.seg button{appearance:none;background:none;border:0;border-radius:7px;padding:7px 15px;font:inherit;font-size:13px;
  font-weight:600;color:var(--navy);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--navy-d);color:#fff}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;margin:6px 0 4px}
.pod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px 0;text-align:center;
  position:relative;overflow:hidden;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.pod:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,28,71,.13)}
.pod .medal{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:800;color:#5a4300;margin:0 auto 9px;border:2px solid rgba(0,0,0,.10)}
.pod.p1 .medal{background:linear-gradient(150deg,#ffe89a,#e3b341);font-size:20px;width:50px;height:50px}
.pod.p2 .medal{background:linear-gradient(150deg,#f0f2f6,#c2c8d4);color:#41474f}
.pod.p3 .medal{background:linear-gradient(150deg,#f3c9a3,#c98b53);color:#5a3312}
.pod .nm{font-size:13.5px;font-weight:700;line-height:1.25;min-height:34px;display:flex;align-items:center;
  justify-content:center;padding:0 2px}
.pod .vl{font-size:27px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums;margin-top:5px;color:var(--navy)}
.pod .un{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.pod .sub{font-size:11.5px;color:var(--ink-2);margin-top:3px}
.pod .sub2{font-size:10.5px;color:var(--ink-3);margin-top:2px;font-weight:500}
.pod .base{margin:12px -14px 0;color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(180deg,var(--navy-l),var(--navy-d))}
.pod.p1 .base{height:76px} .pod.p2 .base{height:56px} .pod.p3 .base{height:40px}
.pod.sel{outline:3px solid var(--navy);outline-offset:-1px}
.rk-empty{text-align:center;color:var(--ink-3);padding:26px 0}
tr.top1 td:first-child,tr.top2 td:first-child,tr.top3 td:first-child{font-weight:800}
td.pos{font-weight:700;color:var(--navy);text-align:center;width:64px}
@media(max-width:700px){
  .podium{grid-template-columns:1fr;align-items:stretch}
  .pod .base{height:34px!important}
  .pod{order:2}.pod.p1{order:1}
}
@media print{#hdr{position:static}#tabs,#fbar,.tbar{display:none}#spacer{display:none}.panel{display:block!important}}
</style>
